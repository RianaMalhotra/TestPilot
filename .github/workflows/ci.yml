name: Backend CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Validate deployment configuration
        run: python -m scripts.validate_deployment
      - name: Run tests and generate JUnit report
        run: python -m pytest -q --junitxml=report.xml
      - name: Benchmark local API
        if: success()
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python -m scripts.benchmark_api --output performance-report.json
      - name: Upload performance report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: testpilot-performance
          path: performance-report.json
          retention-days: 14
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testpilot-junit
          path: report.xml
          if-no-files-found: warn
          retention-days: 14
